
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeadFlow | Lead Capture</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg: #070b14;
            --card: rgba(17, 24, 39, 0.90);
            --border: rgba(255, 255, 255, 0.10);
            --text: #f8fafc;
            --muted: #94a3b8;
            --input: #0f172a;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(59, 130, 246, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(37, 99, 235, 0.12),
                    transparent 30%
                ),
                var(--bg);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 470px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(18px);
        }

        .logo {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                var(--primary),
                #6366f1
            );

            font-size: 23px;
            font-weight: 800;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(59, 130, 246, 0.30);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -0.6px;
        }

        .header p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;
            font-size: 16px;

            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 15px 0 44px;

            background: var(--input);

            border: 1px solid var(--border);
            border-radius: 12px;

            color: var(--text);

            font-size: 14px;

            outline: none;

            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        input.error {
            border-color: var(--danger);
        }

        .error-text {
            display: none;

            color: #f87171;

            font-size: 12px;

            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            height: 54px;

            margin-top: 8px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: all 0.2s ease;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            font-size: 13px;
            line-height: 1.5;

            text-align: center;
        }

        .message.success {
            display: block;

            background: rgba(34, 197, 94, 0.10);

            border: 1px solid rgba(34, 197, 94, 0.25);

            color: #86efac;
        }

        .message.error {
            display: block;

            background: rgba(239, 68, 68, 0.10);

            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #fca5a5;
        }

        .footer {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 25px;

            color: #64748b;

            font-size: 11px;
        }

        .secure-dot {
            width: 6px;
            height: 6px;

            background: var(--success);

            border-radius: 50%;

            box-shadow:
                0 0 8px rgba(34, 197, 94, 0.7);
        }

        #webhookFrame {
            display: none;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            LF
        </div>

        <div class="header">
            <h1>Let's connect.</h1>

            <p>
                Submit your information and our team will get back to you shortly.
            </p>
        </div>


        <!-- Production n8n Webhook -->

        <form
            id="leadForm"
            action="https://bebo-334.app.n8n.cloud/webhook/441c1c11-10e6-4c08-a9b3-c6a2c4b1232d"
            method="POST"
            target="webhookFrame"
        >

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                </div>

                <div id="nameError" class="error-text">
                    Please enter your name.
                </div>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                </div>

                <div id="emailError" class="error-text">
                    Please enter a valid email.
                </div>

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">☎</span>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="03XX XXXXXXX"
                        autocomplete="tel"
                    >

                </div>

                <div id="phoneError" class="error-text">
                    Please enter your phone number.
                </div>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Submit Information
            </button>

        </form>


        <!-- Hidden iframe -->

        <iframe
            name="webhookFrame"
            id="webhookFrame"
        ></iframe>


        <div id="message" class="message"></div>


        <div class="footer">

            <span class="secure-dot"></span>

            Your information is handled securely

        </div>

    </div>


    <script>

        const form = document.getElementById("leadForm");

        const submitBtn =
            document.getElementById("submitBtn");

        const message =
            document.getElementById("message");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const phoneInput =
            document.getElementById("phone");


        function showError(input, errorId) {

            input.classList.add("error");

            document.getElementById(errorId)
                .style.display = "block";
        }


        function removeError(input, errorId) {

            input.classList.remove("error");

            document.getElementById(errorId)
                .style.display = "none";
        }


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;
        }


        function validateForm() {

            let valid = true;


            // Name

            if (nameInput.value.trim() === "") {

                showError(
                    nameInput,
                    "nameError"
                );

                valid = false;

            } else {

                removeError(
                    nameInput,
                    "nameError"
                );
            }


            // Email

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (
                !emailPattern.test(
                    emailInput.value.trim()
                )
            ) {

                showError(
                    emailInput,
                    "emailError"
                );

                valid = false;

            } else {

                removeError(
                    emailInput,
                    "emailError"
                );
            }


            // Phone

            if (
                phoneInput.value.trim().length < 10
            ) {

                showError(
                    phoneInput,
                    "phoneError"
                );

                valid = false;

            } else {

                removeError(
                    phoneInput,
                    "phoneError"
                );
            }


            return valid;
        }


        form.addEventListener(
            "submit",
            function(event) {

                if (!validateForm()) {

                    event.preventDefault();

                    return;
                }


                submitBtn.disabled = true;

                submitBtn.textContent =
                    "Submitting...";


                /*
                    The form is sent directly
                    to the production n8n webhook.
                */

                setTimeout(function() {

                    showMessage(
                        "Your information has been submitted successfully.",
                        "success"
                    );

                    form.reset();

                    submitBtn.disabled = false;

                    submitBtn.textContent =
                        "Submit Information";

                }, 1000);

            }
        );


        nameInput.addEventListener(
            "input",
            function() {

                if (
                    nameInput.value.trim() !== ""
                ) {

                    removeError(
                        nameInput,
                        "nameError"
                    );
                }
            }
        );


        emailInput.addEventListener(
            "input",
            function() {

                if (
                    emailInput.value.includes("@")
                ) {

                    removeError(
                        emailInput,
                        "emailError"
                    );
                }
            }
        );


        phoneInput.addEventListener(
            "input",
            function() {

                if (
                    phoneInput.value.trim().length >= 10
                ) {

                    removeError(
                        phoneInput,
                        "phoneError"
                    );
                }
            }
        );

    </script>

</body>
</html>
